name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint (Biome)
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (Vitest)
        run: npm test
      - name: Build backend
        run: npm run build
      - name: Build Admin-UI
        run: npm --prefix web ci && npm --prefix web run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (smoke test, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: postbote:ci
      - name: Build UI image (smoke test, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: postbote-ui:ci
