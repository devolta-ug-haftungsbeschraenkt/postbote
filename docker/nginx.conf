server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Runtime config must never be cached (token can change between restarts).
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
